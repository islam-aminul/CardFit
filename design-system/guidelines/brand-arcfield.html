<!-- @dsCard group="Brand" viewport="700x240" subtitle="Arc field behind heroes (light) and CTA panels (dark)" name="Voice-arc field" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:16px;background:var(--surface-page)">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  <div style="position:relative;overflow:hidden;height:200px;border-radius:16px;border:1px solid var(--border-subtle);background:var(--color-paper)">
    <svg viewBox="0 0 1040 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">
      <g fill="none" stroke-linecap="round" transform="translate(880 300)">
        <path d="M0 -150 A150 150 0 0 1 0 150" stroke="#2DC7B5" stroke-width="2" opacity="0.85"></path>
        <path d="M0 -210 A210 210 0 0 1 0 210" stroke="#5DCAA5" stroke-width="1.8" opacity="0.7"></path>
        <path d="M0 -275 A275 275 0 0 1 0 275" stroke="#5DCAA5" stroke-width="1.6" opacity="0.55"></path>
        <path d="M0 -345 A345 345 0 0 1 0 345" stroke="#8E96C4" stroke-width="1.5" opacity="0.5"></path>
        <path d="M0 -420 A420 420 0 0 1 0 420" stroke="#B9BEDC" stroke-width="1.3" opacity="0.45"></path>
      </g>
      <circle cx="880" cy="300" r="7" fill="#14B8A6"></circle>
      <circle cx="880" cy="300" r="15" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.35"></circle>
    </svg>
    <div style="position:relative;padding:24px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--text-heading)">Light · heroes</div>
  </div>
  <div style="position:relative;overflow:hidden;height:200px;border-radius:16px;background:var(--color-midnight-900)">
    <svg viewBox="0 0 1040 560" preserveAspectRatio="xMidYMid slice" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%">
      <g fill="none" stroke-linecap="round" transform="translate(160 300)">
        <path d="M0 -150 A150 150 0 0 1 0 150" stroke="#2DC7B5" stroke-width="2" opacity="0.9"></path>
        <path d="M0 -210 A210 210 0 0 1 0 210" stroke="#5DCAA5" stroke-width="1.8" opacity="0.75"></path>
        <path d="M0 -275 A275 275 0 0 1 0 275" stroke="#93AC99" stroke-width="1.6" opacity="0.6"></path>
        <path d="M0 -345 A345 345 0 0 1 0 345" stroke="#6B8A74" stroke-width="1.5" opacity="0.5"></path>
        <path d="M0 -420 A420 420 0 0 1 0 420" stroke="#8E96C4" stroke-width="1.3" opacity="0.45"></path>
      </g>
      <circle cx="160" cy="300" r="7" fill="#14B8A6"></circle>
      <circle cx="160" cy="300" r="15" fill="none" stroke="#14B8A6" stroke-width="1.5" opacity="0.35"></circle>
    </svg>
    <div style="position:relative;padding:24px;font-family:var(--font-display);font-size:20px;font-weight:600;color:#fff">Dark · CTA panels</div>
  </div>
</div>
</body></html>
