<!-- @dsCard group="Colors" viewport="700x150" subtitle="Indigo authority — headings, primary buttons, dark panels" name="Midnight ramp" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:16px;background:var(--surface-page)">
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px">
  <div style="height:64px;border-radius:10px;background:var(--color-midnight-50);border:1px solid var(--border-subtle)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-midnight-100)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-midnight-200)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-midnight-300)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-midnight-600)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-midnight-700)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-midnight-800)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-midnight-900)"></div>
</div>
<div style="display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:6px;font:11px var(--font-sans);color:var(--text-muted);text-align:center">
  <span>50</span><span>100</span><span>200</span><span>300</span><span>600</span><span>700</span><span>800</span><span>900</span>
</div>
</body></html>
