<!-- @dsCard group="Colors" viewport="700x150" subtitle="Paper page, white cards, midnight-50 tiles, ink text" name="Surfaces & neutrals" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:16px;background:var(--surface-page)">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;font:11px var(--font-sans);color:var(--text-muted)">
  <div>
    <div style="height:64px;border-radius:10px;background:var(--color-paper);border:1px solid var(--border-subtle)"></div>
    <div style="margin-top:6px;text-align:center">paper #F4F6FB · page</div>
  </div>
  <div>
    <div style="height:64px;border-radius:10px;background:#fff;border:1px solid var(--border-subtle)"></div>
    <div style="margin-top:6px;text-align:center">white · cards, sections</div>
  </div>
  <div>
    <div style="height:64px;border-radius:10px;background:var(--surface-tile)"></div>
    <div style="margin-top:6px;text-align:center">midnight-50 · tiles, icon chips</div>
  </div>
  <div>
    <div style="height:64px;border-radius:10px;background:var(--color-ink)"></div>
    <div style="margin-top:6px;text-align:center">ink #1A1C2E · base text</div>
  </div>
</div>
</body></html>
