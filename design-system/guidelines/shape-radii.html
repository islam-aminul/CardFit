<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px 24px;background:var(--surface-page)">
<div style="display:flex;gap:14px;align-items:flex-end;font:11px var(--font-sans);color:var(--text-muted);text-align:center">
  <div><div style="width:76px;height:76px;border-radius:8px;background:#fff;border:1px solid var(--border-hover)"></div><div style="margin-top:6px">8 · chips</div></div>
  <div><div style="width:76px;height:76px;border-radius:12px;background:#fff;border:1px solid var(--border-hover)"></div><div style="margin-top:6px">12 · tiles</div></div>
  <div><div style="width:76px;height:76px;border-radius:16px;background:#fff;border:1px solid var(--border-hover)"></div><div style="margin-top:6px">16 · cards</div></div>
  <div><div style="width:76px;height:76px;border-radius:24px;background:var(--color-midnight-900)"></div><div style="margin-top:6px">24 · panels</div></div>
  <div><div style="width:120px;height:44px;border-radius:999px;background:var(--color-midnight-800)"></div><div style="margin-top:6px">pill · buttons, tags</div></div>
