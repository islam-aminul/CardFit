<!-- @dsCard group="Colors" viewport="700x170" subtitle="Text hierarchy on light and dark" name="Text colors in use" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:0;background:var(--surface-page)">
<div style="display:grid;grid-template-columns:1fr 1fr;height:170px">
  <div style="padding:20px 24px">
    <h3 style="margin:0;font-size:20px;color:var(--text-heading)">Heading · midnight-800</h3>
    <p style="margin:8px 0 0;font-size:14px;color:var(--text-body)">Body · midnight-600 at 90%</p>
    <p style="margin:6px 0 0;font-size:13px;color:var(--text-muted)">Muted · midnight-600 at 70%</p>
    <p style="margin:6px 0 0;font-size:13px;font-weight:500;color:var(--color-teal-600)">Link / accent text · teal-600</p>
  </div>
  <div style="padding:20px 24px;background:var(--color-midnight-900)">
    <h3 style="margin:0;font-size:20px;color:#fff">Heading · white</h3>
    <p style="margin:8px 0 0;font-size:14px;color:var(--text-on-dark-muted)">Body on dark · midnight-100 at 80%</p>
    <p style="margin:6px 0 0;font-size:13px;font-weight:500;color:var(--color-teal-300)">Accent on dark · teal-300</p>
  </div>
</div>
</body></html>
