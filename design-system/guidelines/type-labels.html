<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:20px 24px;background:var(--surface-page);display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:32px;align-items:baseline">
  <p class="bv-eyebrow bv-eyebrow--teal">What we do</p>
  <p class="bv-eyebrow bv-eyebrow--sage">Proof, not promises</p>
</div>
<div style="display:flex;gap:32px;align-items:center">
  <span style="font:500 10px var(--font-sans);letter-spacing:var(--tracking-wordmark);color:var(--color-teal-500)">CONSULTANCY</span>
  <span class="bv-tag">Fully offline</span>
  <span class="bv-pill"><span class="bv-dot"></span>Coming soon to Google Play</span>
</div>
<p style="margin:0;font:12px var(--font-sans);color:var(--text-muted)">12px uppercase · medium · tracking 0.2em (eyebrow) / 0.28em (wordmark)</p>
</body></html>
