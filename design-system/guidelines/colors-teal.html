<!-- @dsCard group="Colors" viewport="700x150" subtitle="The clear signal — accents, focus, selection, status" name="Teal (signal)" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:16px;background:var(--surface-page)">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
  <div style="height:64px;border-radius:10px;background:var(--color-teal-300)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-teal-400)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-teal-500);outline:2px solid var(--color-midnight-800);outline-offset:2px"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-teal-600)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-teal-700)"></div>
</div>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px;font:11px var(--font-sans);color:var(--text-muted);text-align:center">
  <span>300</span><span>400</span><span>500 · primary accent</span><span>600 · text on light</span><span>700</span>
</div>
</body></html>
