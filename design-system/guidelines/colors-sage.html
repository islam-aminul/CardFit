<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="padding:16px;background:var(--surface-page)">
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px">
  <div style="height:64px;border-radius:10px;background:var(--color-sage-300)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-sage-400)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-sage-500)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-sage-600)"></div>
  <div style="height:64px;border-radius:10px;background:var(--color-sage-700)"></div>
</div>
<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px;font:11px var(--font-sans);color:var(--text-muted);text-align:center">
  <span>300</span><span>400</span><span>500</span><span>600 · text on light</span><span>700</span>
</div>
</body></html>
