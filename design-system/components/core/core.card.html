<!-- @dsCard group="Components" viewport="700x400" name="Core" subtitle="Button, Eyebrow, Tag, ValueBlock" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
</head>
<body style="padding:20px 24px;display:flex;flex-direction:column;gap:18px;background:var(--surface-page)">
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">
    <button class="bv-btn bv-btn--primary">Start a project</button>
    <button class="bv-btn bv-btn--ghost">See our work</button>
    <button class="bv-btn bv-btn--teal">Get in touch</button>
    <button class="bv-btn bv-btn--sage">Sage</button>
    <span style="display:inline-flex;background:var(--color-midnight-900);border-radius:999px"><button class="bv-btn bv-btn--light">On dark</button></span>
  </div>
  <div style="display:flex;gap:24px;align-items:center">
    <p class="bv-eyebrow bv-eyebrow--teal">What we do</p>
    <p class="bv-eyebrow bv-eyebrow--sage">Proof, not promises</p>
    <span class="bv-pill"><span class="bv-dot"></span>Coming soon to Google Play</span>
  </div>
  <div style="display:flex;gap:8px">
    <span class="bv-tag">Fully offline</span>
    <span class="bv-tag">No accounts</span>
    <span class="bv-tag">No tracking</span>
    <span class="bv-tag">On-device ML</span>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:560px">
    <div>
      <div class="bv-bar bv-bar--teal"></div>
      <h3 style="margin:14px 0 0;font-size:18px;color:var(--text-heading)">Privacy by design</h3>
      <p style="margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--text-body)">We default to collecting nothing.</p>
    </div>
    <div>
      <div class="bv-bar bv-bar--sage"></div>
      <h3 style="margin:14px 0 0;font-size:18px;color:var(--text-heading)">Clarity over complexity</h3>
      <p style="margin:6px 0 0;font-size:13px;line-height:1.55;color:var(--text-body)">Simple to use, honest about what it does.</p>
    </div>
  </div>
</body>
</html>
