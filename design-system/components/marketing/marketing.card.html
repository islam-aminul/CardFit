<!-- @dsCard group="Components" viewport="700x300" name="Marketing" subtitle="ServiceCard, CaseStudyCard" -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
</head>
<body style="padding:20px;background:var(--surface-page)">
  <div style="display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start">
    <div class="bv-card" style="padding:18px">
      <span class="bv-icontile" style="height:36px;width:36px"><img src="../../assets/brand/icon.svg" width="22" height="22" alt=""></span>
      <h3 style="margin:12px 0 0;font-size:15px;color:var(--text-heading)">Web development</h3>
      <p style="margin:6px 0 0;font-size:12px;line-height:1.5;color:var(--text-body)">Fast, accessible web apps and sites built on modern frameworks.</p>
    </div>
    <a href="#" class="bv-case-card" style="display:grid;grid-template-columns:1fr 1.4fr">
      <span style="display:flex;align-items:center;justify-content:center;background:var(--color-midnight-900);padding:18px"><img src="../../assets/cardfit-visual.svg" style="width:100%;max-width:150px" alt=""></span>
      <span style="display:block;padding:18px 20px">
        <span style="display:flex;align-items:center;gap:10px">
          <span style="font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:0.14em;color:var(--color-sage-600)">Android app</span>
          <span class="bv-pill" style="font-size:10px"><span class="bv-dot"></span>Coming soon</span>
        </span>
        <span style="display:block;margin-top:10px;font-family:var(--font-display);font-size:20px;font-weight:600;color:var(--text-heading)">CardFit</span>
        <span style="display:block;margin-top:6px;font-size:12px;line-height:1.55;color:var(--text-body)">A privacy-first, fully-offline app for everyday document paperwork.</span>
        <span style="display:flex;gap:6px;margin-top:12px">
          <span class="bv-tag" style="font-size:10px">Fully offline</span>
          <span class="bv-tag" style="font-size:10px">No accounts</span>
        </span>
      </span>
    </a>
  </div>
</body>
</html>
